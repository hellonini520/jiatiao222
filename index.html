<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生电子请假条</title>
    <style>
        *{margin:0;padding:0;font-family:system-ui,-apple-system;}
        body{
            background: linear-gradient(180deg,#60b4f8,#e6f9ee);
            min-height:100vh;
            padding:20px 16px;
        }
        .top-bar{
            color:#fff;
            font-size:18px;
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:24px;
        }
        .card{
            background:#fff;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 2px 12px #00000015;
        }
        .card-head{
            text-align:center;
            padding:20px 12px 10px;
            border-bottom:1px solid #eee;
        }
        .logo-circle{
            width:60px;height:60px;
            border-radius:50%;
            border:2px solid #42a5f5;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 8px;
        }
        .logo-circle img{width:40px;height:40px;}
        .school-name{
            font-size:22px;
            font-weight:bold;
            color:#226;
        }
        .en-title{
            color:#777;
            font-size:13px;
            margin-top:4px;
        }
        .card-body{
            padding:16px;
        }
        .avatar-box{
            text-align:center;
            margin-bottom:16px;
        }
        .avatar-box img{
            width:140px;
            height:140px;
            object-fit:cover;
            border-radius:12px;
        }
        .row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:10px;
        }
        .item{
            background:#f4f8fc;
            padding:10px 12px;
            border-radius:8px;
        }
        .label{
            font-size:13px;
            color:#666;
            margin-bottom:4px;
        }
        .val{
            font-size:15px;
            color:#222;
        }
        .tag-pass{
            display:inline-block;
            background:#dcf7e4;
            color:#28a745;
            padding:3px 10px;
            border-radius:20px;
            font-size:14px;
        }
        .tag-no{
            display:inline-block;
            background:#ffe9e9;
            color:#dc3545;
            padding:3px 10px;
            border-radius:20px;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>&lt;</span>
        <span>学生电子请假条 - 长沙环境保护职业技术学院</span>
    </div>
    <div class="card">
        <div class="card-head">
            <div class="logo-circle">
                <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/32040103123e40389024120020411311~tplv-a9rns2rl98-image.image" alt="校徽">
            </div>
            <div class="school-name">长沙环境保护职业技术学院</div>
            <div class="en-title">学生电子请假条 · ELECTRONIC LEAVE FORM</div>
        </div>
        <div class="card-body">
            <div class="avatar-box">
                <img src="https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/22030111023444089411010200411123~tplv-a9rns2rl98-image.image" alt="猫猫">
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">审核状态</div>
                    <div class="val"><span class="tag-pass">审核通过</span></div>
                </div>
                <div class="item">
                    <div class="label">是否销假</div>
                    <div class="val"><span class="tag-no">未销假</span></div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">开始日期</div>
                    <div class="val">2026-10-30 18:00</div>
                </div>
                <div class="item">
                    <div class="label">结束时间</div>
                    <div class="val">2026-11-01 18:00</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">姓名</div>
                    <div class="val">易雅琴</div>
                </div>
                <div class="item">
                    <div class="label">性别</div>
                    <div class="val">女</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">电话</div>
                    <div class="val">19310174138</div>
                </div>
                <div class="item">
                    <div class="label">班级</div>
                    <div class="val">L电商25304</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">辅导员</div>
                    <div class="val">张森</div>
                </div>
                <div class="item">
                    <div class="label">辅导员电话</div>
                    <div class="val">15173116317</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">寝室号</div>
                    <div class="val">西区一栋606</div>
                </div>
                <div class="item">
                    <div class="label">学号</div>
                    <div class="val">5182530533</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">目的地</div>
                    <div class="val">湖南省长沙市长沙县</div>
                </div>
                <div class="item">
                    <div class="label">是否出校</div>
                    <div class="val">是</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">请假事由</div>
                    <div class="val">家人明天生日，回家庆生</div>
                </div>
                <div class="item">
                    <div class="label">审核日期</div>
                    <div class="val">2026-10-30 12:14</div>
                </div>
            </div>
            <div class="row">
                <div class="item">
                    <div class="label">实际销假时间</div>
                    <div class="val"></div>
                </div>
                <div class="item">
                    <div class="label">审核未通过理由</div>
                    <div class="val"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
